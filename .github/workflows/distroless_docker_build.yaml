name: Distroless Docker Build & Push
"on":
  workflow_dispatch: null
  push:
    branches:
      - main
    paths:
      - distroless/**
      - .github/workflows/distroless_docker_build.yaml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-distroless
  cancel-in-progress: false
permissions:
  contents: read
env:
  repository: distroless
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      version: ${{ steps.setup_builder.outputs.version }}
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record build revision
        run: |
          printf 'Build revision: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Install build dependencies
        run: |
          chmod +x .github/scripts/install_build_deps.sh
          bash .github/scripts/install_build_deps.sh
      - name: Set up params
        id: setup_builder
        run: |
          vers=$(yq ".version" "${{ env.repository }}/config.yaml")
          echo "version=$vers" >> "$GITHUB_OUTPUT"
          archs=$(yq ".arch" "${{ env.repository }}/config.yaml")
          echo "archs=$archs" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: local/${{ env.repository }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MPL-2.0 AND LicenseRef-IANA-TZ-Public-Domain
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{version}}-${{github.run_number}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{version}}-${{github.run_number}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ steps.setup_builder.outputs.version }}
      - name: Build immutable image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.repository }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          platforms: ${{ steps.setup_builder.outputs.archs }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Stage image archive
        run: |-
          mkdir -p artifact
          mv "$RUNNER_TEMP/image.tar" artifact/image.tar
      - name: Checksum image archive
        id: digest
        run: echo "sha256=$(sha256sum artifact/image.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload immutable image archive
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact/image.tar
          if-no-files-found: error
          retention-days: 1
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact
          merge-multiple: true
      - name: Verify image checksum
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |-
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s  artifact/image.tar\n' "$EXPECTED_SHA256" | sha256sum -c -
      - name: Install registry copy tool
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.repository}}
            ghcr.io/${{ github.repository_owner }}/${{ env.repository }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MPL-2.0 AND LicenseRef-IANA-TZ-Public-Domain
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{version}}-${{github.run_number}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.build.outputs.version }}
            type=semver,pattern=v{{version}},value=${{ needs.build.outputs.version }}
            type=semver,pattern=v{{version}}-${{github.run_number}},value=${{ needs.build.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.build.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ needs.build.outputs.version }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true
      - name: Publish verified image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |-
          while IFS= read -r tag; do
            test -n "$tag"
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" oci-archive:artifact/image.tar "docker://$tag"
          done <<< "$TAGS"
