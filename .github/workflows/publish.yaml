      packages: write
    with:
      image: crunchy-postgres-vectorchord
      mode: declarative
      version: ${{ needs.crunchy_postgres_vectorchord_decide.outputs.version }}
      fingerprint: ${{ needs.crunchy_postgres_vectorchord_decide.outputs.fingerprint }}
      context: crunchy-postgres-vectorchord
      platforms: linux/amd64
      native-arm: false
      smoke-command: bash crunchy-postgres-vectorchord/smoke-test.sh local/publishing-smoke:latest
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
