  crunchy_postgres_vectorchord_decide:
    name: Decide (crunchy-postgres-vectorchord)
    if: ${{ github.event_name == 'schedule' || inputs.image == 'all' || inputs.image == 'crunchy-postgres-vectorchord' }}
    uses: zekihan/release-workflows/.github/workflows/decide.yaml@5fa11e0c1104623d17a191557a27e86a7715f778 # main
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      image: crunchy-postgres-vectorchord
      mode: declarative
