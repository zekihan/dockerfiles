      force: ${{ inputs.force || false }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  crunchy_postgres_vectorchord_checks:
    name: Checks (crunchy-postgres-vectorchord)
    needs: crunchy_postgres_vectorchord_decide
    if: ${{ needs.crunchy_postgres_vectorchord_decide.outputs.build == 'true' }}
    uses: ./.github/workflows/checks.yaml
    permissions:
      contents: read
  crunchy_postgres_vectorchord_publish:
    name: Image (crunchy-postgres-vectorchord)
    needs:
