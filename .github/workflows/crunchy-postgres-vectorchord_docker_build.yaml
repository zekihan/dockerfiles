name: Crunchy PostgreSQL VectorChord Docker Build, Test & Push

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crunchy-postgres-vectorchord/**'
      - '.github/workflows/crunchy-postgres-vectorchord_docker_build.yaml'
  push:
    branches:
      - main
    paths:
      - 'crunchy-postgres-vectorchord/**'
      - '.github/workflows/crunchy-postgres-vectorchord_docker_build.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-crunchy-postgres-vectorchord
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  repository: crunchy-postgres-vectorchord

jobs:
  build_test_push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: bash .github/scripts/install_build_deps.sh

      - name: Set up params
        id: params
        run: |
          version=$(yq '.version' "$repository/config.yaml")
          nonce=$(yq '.nonce' "$repository/config.yaml")
          arch=$(yq '.arch' "$repository/config.yaml")
          test "$arch" = linux/amd64
          {
            echo "version=$version"
            echo "arch=$arch"
            echo "nonce=$nonce"
          } >> "$GITHUB_OUTPUT"

      - name: Check shell syntax
        run: |
          bash -n "$repository/smoke-test.sh"
          shellcheck "$repository/smoke-test.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image for testing
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.repository }}
          load: true
          push: false
          tags: local/crunchy-postgres-vectorchord:${{ steps.params.outputs.version }}
          platforms: ${{ steps.params.outputs.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test extensions, index, restart and logical restore
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: bash "$repository/smoke-test.sh" "local/crunchy-postgres-vectorchord:$VERSION"

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Publish the tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GHCR_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.params.outputs.version }}
          NONCE: ${{ steps.params.outputs.nonce }}
        run: |
          for registry in "docker.io/$DOCKER_USERNAME" "ghcr.io/${GHCR_OWNER,,}"; do
            for tag in "$VERSION" "$VERSION-r$NONCE-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"; do
              destination="$registry/$repository:$tag"
              docker tag "local/crunchy-postgres-vectorchord:$VERSION" "$destination"
              docker push "$destination"
            done
          done
