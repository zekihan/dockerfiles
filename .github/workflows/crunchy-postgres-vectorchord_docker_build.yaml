name: Crunchy PostgreSQL VectorChord Docker Build, Test & Push
"on":
  workflow_dispatch: null
  pull_request:
    paths:
      - crunchy-postgres-vectorchord/**
      - .github/workflows/crunchy-postgres-vectorchord_docker_build.yaml
  push:
    branches:
      - main
    paths:
      - crunchy-postgres-vectorchord/**
      - .github/workflows/crunchy-postgres-vectorchord_docker_build.yaml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-crunchy-postgres-vectorchord
  cancel-in-progress: false
permissions:
  contents: read
env:
  repository: crunchy-postgres-vectorchord
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      version: ${{ steps.params.outputs.version }}
      nonce: ${{ steps.params.outputs.nonce }}
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install build dependencies
        run: bash .github/scripts/install_build_deps.sh
      - name: Set up params
        id: params
        run: |
          version=$(yq '.version' "$repository/config.yaml")
          nonce=$(yq '.nonce' "$repository/config.yaml")
          arch=$(yq '.arch' "$repository/config.yaml")
          test "$arch" = linux/amd64
          {
            echo "version=$version"
            echo "arch=$arch"
            echo "nonce=$nonce"
          } >> "$GITHUB_OUTPUT"
      - name: Check shell syntax
        run: |
          bash -n "$repository/smoke-test.sh"
          shellcheck "$repository/smoke-test.sh"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.repository }}
          load: true
          push: false
          tags: local/crunchy-postgres-vectorchord:${{ steps.params.outputs.version }}
          platforms: ${{ steps.params.outputs.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test extensions, index, restart and logical restore
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: bash "$repository/smoke-test.sh" "local/crunchy-postgres-vectorchord:$VERSION"
      - name: Export tested image
        run: |
          mkdir -p artifact
          docker save "local/crunchy-postgres-vectorchord:${{ steps.params.outputs.version }}" -o artifact/image.tar
      - name: Checksum image archive
        id: digest
        run: echo "sha256=$(sha256sum artifact/image.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload immutable image archive
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact/image.tar
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifact
          merge-multiple: true
      - name: Verify image checksum
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |-
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s  artifact/image.tar\n' "$EXPECTED_SHA256" | sha256sum -c -
      - name: Install registry copy tool
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true
      - name: Publish verified tested image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GHCR_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
          NONCE: ${{ needs.build.outputs.nonce }}
        run: |-
          for registry in "docker.io/$DOCKER_USERNAME" "ghcr.io/${GHCR_OWNER,,}"; do
            for tag in "$VERSION" "$VERSION-r$NONCE-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"; do
              skopeo copy --all --authfile "$HOME/.docker/config.json" docker-archive:artifact/image.tar "docker://$registry/$repository:$tag"
            done
          done
