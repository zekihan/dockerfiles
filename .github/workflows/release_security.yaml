name: Release security regression tests
"on":
  pull_request:
    paths:
      - .github/workflows/**
      - .github/scripts/**
      - dmarc-report-converter/**
      - tests/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/scripts/**
      - dmarc-report-converter/**
      - tests/**
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/install_build_deps.sh
      - run: python3 -m pip install -r .github/scripts/requirements-policy.txt
      - run: python3 -m unittest discover -s tests -v
      - run: shellcheck dmarc-report-converter/verify-source.sh
