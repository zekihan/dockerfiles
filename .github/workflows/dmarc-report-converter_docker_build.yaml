name: Dmarc Report Converter Docker Build & Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dmarc-report-converter/**'
      - '.github/workflows/dmarc-report-converter_docker_build.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-dmarc-report-converter
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  repository: dmarc-report-converter
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          chmod +x .github/scripts/install_build_deps.sh
          bash .github/scripts/install_build_deps.sh

      - name: Set up params
        id: setup_builder
        run: |
          vers=$(yq ".version" "${{ env.repository }}/config.yaml")
          echo "version=$vers" >> "$GITHUB_OUTPUT"
          archs=$(yq ".arch" "${{ env.repository }}/config.yaml")
          echo "archs=$archs" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            docker.io/${{ env.DOCKER_USERNAME }}/${{ env.repository}}
            ghcr.io/${{ github.repository_owner }}/${{ env.repository }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only AND MIT AND BSD-3-Clause AND Apache-2.0 AND GPL-2.0-only AND MPL-2.0
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{version}}-${{github.run_number}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{version}}-${{github.run_number}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ steps.setup_builder.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          logout: true

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.repository }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ steps.setup_builder.outputs.archs }}
