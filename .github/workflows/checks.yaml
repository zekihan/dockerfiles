name: Native checks
'on':
  pull_request: null
  workflow_call:
    inputs:
      image:
        type: string
        required: true
    outputs:
      platforms:
        value: ${{ jobs.check.outputs.platforms }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: |
        bash .github/scripts/install_build_deps.sh
        python3 -m pip install -r .github/scripts/requirements-policy.txt
    - name: Validate build platforms
      id: platforms
      env:
        PUBLISH_IMAGE: ${{ inputs.image }}
      run: python3 .github/scripts/check_build_platforms.py
    - run: |
        python3 .github/scripts/check_action_pins.py
        python3 -m unittest discover -s tests -v
    - run: |
        bash -n protonmailbridge/entrypoint.sh
        bash -n crunchy-postgres-vectorchord/smoke-test.sh
        bash -n crowdsec-agent/smoke-test.sh
        sh -n crowdsec-agent/apply-whitelists.sh
        shellcheck crunchy-postgres-vectorchord/smoke-test.sh crowdsec-agent/smoke-test.sh crowdsec-agent/apply-whitelists.sh
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: ${{ inputs.image == '' || inputs.image == 'crowdsec-agent' }}
      with:
        go-version-file: crowdsec-agent/supervisor/go.mod
        cache: false
    - name: Scan CrowdSec supervisor
      if: ${{ inputs.image == '' || inputs.image == 'crowdsec-agent' }}
      working-directory: crowdsec-agent/supervisor
      env:
        CGO_ENABLED: '0'
        GOTOOLCHAIN: local
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
